<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Clips — ClipForge</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/status-banner.js"></script>
  <header class="topbar">
    <a href="/" class="brand"><span class="brand-mark"></span> ClipForge</a>
    <a href="/" class="pill-link">Keluar</a>
  </header>

  <nav class="stepper" aria-label="Progress">
    <div class="stepper-track"><div class="stepper-fill" style="width: 78%;"></div></div>
    <div class="stepper-labels">
      <span class="done">1. Upload</span>
      <span class="done">2. Rules</span>
      <span class="done">3. Notes</span>
      <span class="done">4. Generate</span>
      <span class="active">5. Candidates</span>
      <span>6. Blueprint</span>
    </div>
  </nav>

  <main class="shell">
    <span class="eyebrow">LANGKAH 5 DARI 6</span>
    <h1>Nih, momen-momen terbaiknya 🔥</h1>
    <p>Pilih satu buat dibedah jadi Clip Blueprint lengkap.</p>

    <div id="candidateList"></div>
  </main>

  <script src="/js/state.js"></script>
  <script src="/js/candidates.js"></script>
</body>
</html>
